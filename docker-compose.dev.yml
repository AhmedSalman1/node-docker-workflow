services:
  node-app:
    build:
      context: .
      target: development
    environment:
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      # Compose Watch: auto-update running container on file save.
      # Run with: docker compose -f docker-compose.dev.yml up --watch --build
      watch:
        # Hot reload: sync host ./src into /app/src.
        # No rebuild — nodemon (npm run dev) restarts on change.
        - path: ./src
          action: sync
          target: /app/src
        # Deps changed: rebuild image + recreate container.
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
