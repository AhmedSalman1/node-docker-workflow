services:
  node-app:
    environment:
      - NODE_ENV=development
    develop:
      # Compose Watch: auto-update running container on file save.
      # Run with: docker compose -f docker-compose.dev.yml up --watch --build
      watch:
        # Hot reload: sync host ./src into /app/src.
        # No rebuild — nodemon (npm run dev) restarts on change.
        - path: ./src
          action: sync
          target: /app/src
        # Deps changed: rebuild image + recreate container.
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

# Now
# - Detached workflow is two terminals / two commands:
# 1. docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 2. docker-compose -f docker-compose.yml -f docker-compose.dev.yml watch

# Old
# 1. docker compose -f docker-compose.dev.yml up -d --build
# 2. docker compose -f docker-compose.dev.yml watch — keep this running; it does the sync/rebuild.
